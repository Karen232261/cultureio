<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Culture I/O</title>
<style>
  body { margin: 0; background: #ffffff; overflow: hidden; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #status-bar {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    font-family: sans-serif; font-size: 14px; color: #333;
  }
  #tour-toggle {
    background: rgba(0, 0, 0, 0.05);
    border: 1px solid rgba(0, 0, 0, 0.25);
    color: #333;
    font-family: sans-serif;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  #tour-toggle:hover { background: rgba(0, 0, 0, 0.1); }

  #image-popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
  }
  #image-popup-overlay.open { display: flex; }
  #image-popup-img {
    max-width: 90vw;
    max-height: 80vh;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }
  #image-popup-caption {
    color: #fff;
    font-family: sans-serif;
    margin-top: 15px;
    max-width: 80vw;
    text-align: center;
    font-size: 1rem;
  }
  #image-popup-close {
    position: absolute;
    top: 20px;
    right: 30px;
    background: none;
    border: none;
    color: #fff;
    font-size: 2.5rem;
    line-height: 1;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="status-bar">
  <span id="status">Loading graph data...</span>
  <button id="tour-toggle">Auto Tour: Off</button>
</div>
<canvas id="graph"></canvas>

<div id="image-popup-overlay">
  <button id="image-popup-close" aria-label="Close">&times;</button>
  <img id="image-popup-img" alt="">
  <div id="image-popup-caption"></div>
</div>
<script>
  const imagePopupOverlay = document.getElementById('image-popup-overlay');
  const imagePopupImg = document.getElementById('image-popup-img');
  const imagePopupCaption = document.getElementById('image-popup-caption');
  const imagePopupClose = document.getElementById('image-popup-close');

  // function showImagePopup(imgUrl, caption, sceneText) {
  //   imagePopupImg.src = imgUrl || '';
  //   const lines = [caption, sceneText].filter(t => t && t.trim() !== '');
  //   if (lines.length > 0) {
  //     imagePopupCaption.textContent = lines.join(' · ');
  //     imagePopupCaption.style.display = 'block';
  //   } else {
  //     imagePopupCaption.textContent = '';
  //     imagePopupCaption.style.display = 'none';
  //   }
  //   imagePopupOverlay.classList.add('open');
  // }

  function showImagePopup(imgUrl, caption) {
    imagePopupImg.src = imgUrl || '';
    if (caption && caption.trim() !== '') {
      imagePopupCaption.textContent = caption;
      imagePopupCaption.style.display = 'block';
    } else {
      imagePopupCaption.textContent = '';
      imagePopupCaption.style.display = 'none';
    }
    imagePopupOverlay.classList.add('open');
  }

  function hideImagePopup() {
    imagePopupOverlay.classList.remove('open');
    imagePopupImg.src = '';
  }

  imagePopupClose.addEventListener('click', hideImagePopup);
  imagePopupOverlay.addEventListener('click', (e) => {
    if (e.target === imagePopupOverlay) hideImagePopup();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideImagePopup();
  });
</script>

<script>
let nodes = [];
let edges = [];

// physics parameters
const repulsionStrength = 4000;
const springLength = 180;
const springStrength = 0.01;
const damping = 0.85;
const timeStep = 0.5;
const nodeRadius = 22;
// Max dimension (in either direction) a photo node is scaled to once loaded --
// images keep their natural aspect ratio instead of being forced into a circle.
const maxNodeDimension = 44;
// Hubs render larger than regular nodes so the representative photo reads
// as the center of its cluster.
const maxHubDimension = 76;

// Cluster force parameters: how strongly nodes get pulled toward their
// scene category's anchor point. Actual per-node strength is scaled by
// that node's classification confidence (see applyForces below) --
// a confident label pulls hard toward the cluster, an unsure one barely
// pulls at all and drifts near the edges instead.
const clusterBaseStrength = 0.15;
const clusterMaxStrength = 1.2;

// function sceneText(n) {
//   if (!n.sceneSpecific || n.sceneSpecific === "unclassified") return "";
//   const pct = Math.round((n.sceneConfidence || 0) * 100);
//   return `${n.sceneSpecific} (${pct}%)`;
// }

// Deterministic hash so the same category always gets the same anchor
// spot across reloads, instead of jumping around each time.
function hashString(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(h, 31) + str.charCodeAt(i)) | 0;
  return h;
}

const CLUSTER_RADIUS = 500;
const clusterAnchors = new Map();
function anchorFor(category) {
  if (!clusterAnchors.has(category)) {
    const h = hashString(category);
    const angle = ((h % 10000) / 10000) * Math.PI * 2;
    clusterAnchors.set(category, {
      x: canvas.width / 2 + Math.cos(angle) * CLUSTER_RADIUS,
      y: canvas.height / 2 + Math.sin(angle) * CLUSTER_RADIUS,
    });
  }
  return clusterAnchors.get(category);
}

// HTML Canvas setup
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

let zoom = 1;
let panX = 0;
let panY = 0;
const minZoom = 0.05;
const maxZoom = 5;

function screenToWorld(screenPos) {
  return {
    x: (screenPos.x - panX) / zoom,
    y: (screenPos.y - panY) / zoom
  };
}

// Dragging / panning state
let draggingNode = null;
let offsetX = 0;
let offsetY = 0;
let isPanning = false;
let panStart = { x: 0, y: 0 };
let panOrigin = { x: 0, y: 0 };

// Distinguishes a click (open the popup) from a drag (move the node/pan).
let mouseDownPos = null;
let dragMoved = false;

function findNodeAt(worldPos) {
  for (const node of nodes) {
    const dx = worldPos.x - node.x;
    const dy = worldPos.y - node.y;
    const size = node.isHub ? maxHubDimension : maxNodeDimension;
    const halfW = (node.drawW || size) / 2;
    const halfH = (node.drawH || size) / 2;
    if (Math.abs(dx) < halfW && Math.abs(dy) < halfH) return node;
  }
  return null;
}

canvas.addEventListener('mousedown', (e) => {
  if (mode === 'tour') return; // camera is automated -- ignore manual input
  mouseDownPos = { x: e.clientX, y: e.clientY };
  dragMoved = false;
  const worldPos = screenToWorld(getMousePos(e));
  const hit = findNodeAt(worldPos);
  if (hit) {
    draggingNode = hit;
    offsetX = worldPos.x - hit.x;
    offsetY = worldPos.y - hit.y;
    hit.vx = 0;
    hit.vy = 0;
  } else {
    // Didn't hit a node — drag the background instead (pan the camera).
    isPanning = true;
    panStart = { x: e.clientX, y: e.clientY };
    panOrigin = { x: panX, y: panY };
  }
  canvas.style.cursor = 'grabbing';
});

canvas.addEventListener('mousemove', (e) => {
  if (mode === 'tour') return; // camera is automated -- ignore manual input
  if ((draggingNode || isPanning) && mouseDownPos) {
    const dx = e.clientX - mouseDownPos.x;
    const dy = e.clientY - mouseDownPos.y;
    if (Math.sqrt(dx * dx + dy * dy) > 3) dragMoved = true;
  }

  if (draggingNode) {
    const worldPos = screenToWorld(getMousePos(e));
    draggingNode.x = worldPos.x - offsetX;
    draggingNode.y = worldPos.y - offsetY;
  } else if (isPanning) {
    panX = panOrigin.x + (e.clientX - panStart.x);
    panY = panOrigin.y + (e.clientY - panStart.y);
  } else {
    // Idle — show a pointer cursor when hovering a clickable node.
    const worldPos = screenToWorld(getMousePos(e));
    canvas.style.cursor = findNodeAt(worldPos) ? 'pointer' : 'grab';
  }
});

canvas.addEventListener('mouseup', () => {
  // A click (no drag) on a node opens the popup instead of just releasing it.
  if (!dragMoved && draggingNode && !draggingNode.isHub) {
    showImagePopup(
      draggingNode.imgEl ? draggingNode.imgEl.src : '',
      draggingNode.caption,
      // sceneText(draggingNode)
    );
  }
  draggingNode = null;
  isPanning = false;
  canvas.style.cursor = 'grab';
});
canvas.addEventListener('mouseleave', () => {
  draggingNode = null;
  isPanning = false;
  canvas.style.cursor = 'grab';
});

// Scroll to zoom, centered on the cursor.
canvas.addEventListener('wheel', (e) => {
  if (mode === 'tour') return; // camera is automated -- ignore manual input
  e.preventDefault();
  const mousePos = getMousePos(e);
  const worldBefore = screenToWorld(mousePos);

  const zoomFactor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  zoom = Math.min(Math.max(zoom * zoomFactor, minZoom), maxZoom);

  // Keep the point under the cursor fixed in place while zooming.
  panX = mousePos.x - worldBefore.x * zoom;
  panY = mousePos.y - worldBefore.y * zoom;
}, { passive: false });

function getMousePos(evt) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: evt.clientX - rect.left,
    y: evt.clientY - rect.top
  };
}

// Force Simulation
function applyForces() {
  for (let i = 0; i < nodes.length; i++) {
    nodes[i].ax = 0;
    nodes[i].ay = 0;
  }

  // Repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[j].x - nodes[i].x;
      const dy = nodes[j].y - nodes[i].y;
      const distSq = dx * dx + dy * dy || 0.01;
      const dist = Math.sqrt(distSq);
      const force = repulsionStrength / distSq;

      const fx = force * (dx / dist);
      const fy = force * (dy / dist);

      nodes[i].ax -= fx;
      nodes[i].ay -= fy;
      nodes[j].ax += fx;
      nodes[j].ay += fy;
    }
  }

  // Springs -- pull each image toward its broad-category hub. Confidence
  // scales strength per edge: a confident classification pulls hard
  // toward the hub, an unsure one barely pulls and drifts further out.
  for (const edge of edges) {
    const source = edge.sourceNode;
    const target = edge.targetNode;
    const dx = target.x - source.x;
    const dy = target.y - source.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
    const displacement = dist - springLength;
    const strength = springStrength * (0.3 + 1.7 * (edge.confidence || 0));
    const force = strength * displacement;

    const fx = force * (dx / dist);
    const fy = force * (dy / dist);

    source.ax += fx;
    source.ay += fy;
    target.ax -= fx;
    target.ay -= fy;
  }

  // Cluster attraction: pull each image toward its scene SUBcategory's
  // anchor point (finer-grained than the hub above), also confidence-scaled.
  for (const node of nodes) {
    if (node.isHub) continue;
    const anchor = anchorFor(node.sceneSpecific || "unclassified");
    const strength = clusterBaseStrength +
      (node.sceneConfidence || 0) * (clusterMaxStrength - clusterBaseStrength);
    node.ax += (anchor.x - node.x) * strength * 0.01;
    node.ay += (anchor.y - node.y) * strength * 0.01;
  }
}

function updatePositions() {
  for (const node of nodes) {
    if (node === draggingNode) continue;
    node.vx = (node.vx + node.ax * timeStep) * damping;
    node.vy = (node.vy + node.ay * timeStep) * damping;
    node.x += node.vx * timeStep;
    node.y += node.vy * timeStep;
  }
}

// Drawing
function drawGraph() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(zoom, 0, 0, zoom, panX, panY);

  // Draw edges -- opacity reflects confidence, same as their spring strength
  for (const edge of edges) {
    const s = edge.sourceNode;
    const t = edge.targetNode;
    ctx.strokeStyle = `rgba(136,136,255,${0.15 + 0.6 * (edge.confidence || 0)})`;
    ctx.lineWidth = (0.5 + 2 * (edge.confidence || 0)) / zoom;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(t.x, t.y);
    ctx.stroke();
  }
  // Draw nodes
  for (const node of nodes) {
    if (node.isHub) {
      if (node.imgEl && node.loaded) {
        if (!node.drawW) {
          const scale = maxHubDimension / Math.max(node.imgEl.naturalWidth, node.imgEl.naturalHeight);
          node.drawW = node.imgEl.naturalWidth * scale;
          node.drawH = node.imgEl.naturalHeight * scale;
        }
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 10 / zoom;
        ctx.shadowOffsetY = 3 / zoom;
        ctx.drawImage(
          node.imgEl,
          node.x - node.drawW / 2, node.y - node.drawH / 2,
          node.drawW, node.drawH
        );
        ctx.restore();

        ctx.strokeStyle = '#ffaa33';
        ctx.lineWidth = 3 / zoom;
        ctx.strokeRect(
          node.x - node.drawW / 2, node.y - node.drawH / 2,
          node.drawW, node.drawH
        );
      } else {
        ctx.fillStyle = '#ccc';
        ctx.fillRect(
          node.x - maxHubDimension / 2, node.y - maxHubDimension / 2,
          maxHubDimension, maxHubDimension
        );
      }

      ctx.font = `bold ${13 / zoom}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#333';
      const labelY = node.y + (node.drawH || maxHubDimension) / 2 + 16 / zoom;
      ctx.fillText(node.label, node.x, labelY);
      continue;
    }

    if (node.imgEl && node.loaded) {
      // Preserve the photo's natural aspect ratio -- no circular (or any) mask.
      if (!node.drawW) {
        const scale = maxNodeDimension / Math.max(node.imgEl.naturalWidth, node.imgEl.naturalHeight);
        node.drawW = node.imgEl.naturalWidth * scale;
        node.drawH = node.imgEl.naturalHeight * scale;
      }
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
      ctx.shadowBlur = 6 / zoom;
      ctx.shadowOffsetY = 2 / zoom;
      ctx.drawImage(
        node.imgEl,
        node.x - node.drawW / 2, node.y - node.drawH / 2,
        node.drawW, node.drawH
      );
      ctx.restore();
    } else {
      ctx.fillStyle = '#ccc';
      ctx.fillRect(
        node.x - maxNodeDimension / 2, node.y - maxNodeDimension / 2,
        maxNodeDimension, maxNodeDimension
      );
    }
  }
}

function animate(now) {
  applyForces();
  updatePositions();
  drawGraph();

  if (mode === 'tour') {
    const elapsed = now - tourStateStartTime;
    if (elapsed >= DURATIONS_MS[tourState]) {
      enterTourState((tourState + 1) % 4, now);
    }
    updateCameraTween(now);
  }

  requestAnimationFrame(animate);
}

// ------------------------------------------------------------------
// Auto Tour mode -- automatically zooms into each photo in turn, holds,
// zooms back out to the overview, then moves to the next one. Driven
// off the same requestAnimationFrame loop as the physics/draw code
// above (one clock, not a second competing timer system).
// ------------------------------------------------------------------

const TOUR_OVERVIEW = 0;
const TOUR_ZOOM_IN = 1;
const TOUR_HOLD = 2;
const TOUR_ZOOM_OUT = 3;
const DURATIONS_MS = {
  [TOUR_OVERVIEW]: 4000,
  [TOUR_ZOOM_IN]: 2000,
  [TOUR_HOLD]: 7000,
  [TOUR_ZOOM_OUT]: 2000,
};

let mode = 'manual'; // 'manual' | 'tour'
let tourState = TOUR_OVERVIEW;
let tourStateStartTime = 0;
let tourIndex = 0;             // round-robin position in the chronological node list
let tourPriorityQueue = [];    // mongoIds of new submissions waiting to be shown next
let currentTourNode = null;    // node currently focused during ZOOM_IN/HOLD

// Camera tween state. 'toNode' follows a (possibly still-moving) node's
// live x/y every frame as it zooms in; 'toOverview' interpolates pan
// and zoom together toward a fixed target, since the overview framing
// doesn't track any single node.
const tween = {
  active: false, mode: 'toOverview', startTime: 0, duration: 1,
  startZoom: 1, targetZoom: 1, startPanX: 0, startPanY: 0, targetPanX: 0, targetPanY: 0,
};

function easeInOutQuad(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

// Frames the whole graph -- used for the OVERVIEW state and as the
// ZOOM_OUT target.
function computeOverviewFit() {
  if (!nodes.length) return null;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const node of nodes) {
    const size = node.isHub ? maxHubDimension : maxNodeDimension;
    const halfW = (node.drawW || size) / 2;
    const halfH = (node.drawH || size) / 2;
    minX = Math.min(minX, node.x - halfW);
    maxX = Math.max(maxX, node.x + halfW);
    minY = Math.min(minY, node.y - halfH);
    maxY = Math.max(maxY, node.y + halfH);
  }
  const padding = 80; // room for hub labels drawn below their dot, plus breathing room
  minX -= padding; maxX += padding;
  minY -= padding; maxY += padding;

  const width = Math.max(maxX - minX, 1);
  const height = Math.max(maxY - minY, 1);
  const targetZoom = Math.min(Math.max(Math.min(canvas.width / width, canvas.height / height), minZoom), maxZoom);
  const centerX = (minX + maxX) / 2;
  const centerY = (minY + maxY) / 2;

  return {
    zoom: targetZoom,
    panX: canvas.width / 2 - centerX * targetZoom,
    panY: canvas.height / 2 - centerY * targetZoom,
  };
}

// Just the target zoom level for a single-photo focus -- panning is
// handled live in updateCameraTween() so it can follow the node if it
// drifts while zoomed in.
function computeNodeFocusZoom(node) {
  const desiredDisplayRadius = Math.min(canvas.width, canvas.height) * 0.32;
  const halfSize = Math.max(node?.drawW || maxNodeDimension, node?.drawH || maxNodeDimension) / 2;
  return Math.min(Math.max(desiredDisplayRadius / halfSize, minZoom), maxZoom);
}

function beginCameraTween({ mode: tweenMode, targetZoom, targetPanX, targetPanY, duration }, now) {
  tween.active = true;
  tween.mode = tweenMode;
  tween.startTime = now;
  tween.duration = Math.max(duration, 1);
  tween.startZoom = zoom;
  tween.targetZoom = targetZoom;
  tween.startPanX = panX;
  tween.startPanY = panY;
  tween.targetPanX = targetPanX;
  tween.targetPanY = targetPanY;
}

// Called every animate() frame while touring. Advances any active tween;
// while focused on a node (mid zoom-in, or holding), keeps it centered
// even if the physics sim nudges it.
function updateCameraTween(now) {
  if (!tween.active) {
    if ((tourState === TOUR_ZOOM_IN || tourState === TOUR_HOLD) && currentTourNode) {
      panX = canvas.width / 2 - currentTourNode.x * zoom;
      panY = canvas.height / 2 - currentTourNode.y * zoom;
    }
    return;
  }

  const t = Math.min((now - tween.startTime) / tween.duration, 1);
  const eased = easeInOutQuad(t);
  zoom = tween.startZoom + (tween.targetZoom - tween.startZoom) * eased;

  if (tween.mode === 'toNode' && currentTourNode) {
    panX = canvas.width / 2 - currentTourNode.x * zoom;
    panY = canvas.height / 2 - currentTourNode.y * zoom;
  } else {
    panX = tween.startPanX + (tween.targetPanX - tween.startPanX) * eased;
    panY = tween.startPanY + (tween.targetPanY - tween.startPanY) * eased;
  }

  if (t >= 1) tween.active = false;
}

// Chronological round-robin through the photo nodes, except newly
// arrived submissions (pushed on by interruptForNewSubmission) always
// jump the queue.
function pickNextNode() {
  while (tourPriorityQueue.length) {
    const id = tourPriorityQueue.shift();
    const candidate = nodesById.get(id);
    if (candidate && !candidate.isHub) return candidate;
    // else: node was removed/unapproved before its turn came up -- skip it
  }

  const photoNodes = nodes.filter(n => !n.isHub);
  if (!photoNodes.length) return null;
  tourIndex = tourIndex % photoNodes.length;
  const node = photoNodes[tourIndex];
  tourIndex = (tourIndex + 1) % photoNodes.length;
  return node;
}

function enterTourState(state, now) {
  tourState = state;
  tourStateStartTime = now;

  if (state === TOUR_ZOOM_IN) {
    currentTourNode = pickNextNode();
    if (currentTourNode) {
      beginCameraTween({
        mode: 'toNode',
        targetZoom: computeNodeFocusZoom(currentTourNode),
        duration: DURATIONS_MS[TOUR_ZOOM_IN],
      }, now);
    }
  } else if (state === TOUR_ZOOM_OUT) {
    const fit = computeOverviewFit();
    if (fit) {
      beginCameraTween({
        mode: 'toOverview',
        targetZoom: fit.zoom, targetPanX: fit.panX, targetPanY: fit.panY,
        duration: DURATIONS_MS[TOUR_ZOOM_OUT],
      }, now);
    }
    currentTourNode = null;
  } else {
    // TOUR_OVERVIEW: camera's already framed correctly (ZOOM_OUT just
    // finished, or startTour() just snapped/tweened us here) -- just hold.
    // TOUR_HOLD: nothing to kick off here; updateCameraTween() keeps the
    // camera on currentTourNode for the whole hold, the timer alone
    // decides when we move on.
    currentTourNode = state === TOUR_HOLD ? currentTourNode : null;
  }
}

// New submissions cut the current hold/zoom-in short: zoom out immediately,
// then the interrupted node's replacement (this new one) becomes the very
// next ZOOM_IN target via the priority queue.
function interruptForNewSubmission(newNodeIds) {
  tourPriorityQueue.push(...newNodeIds);
  if (tourState === TOUR_HOLD || tourState === TOUR_ZOOM_IN) {
    enterTourState(TOUR_ZOOM_OUT, performance.now());
  }
  // If we're already in OVERVIEW or ZOOM_OUT, no need to interrupt --
  // the queue gets consulted the next time ZOOM_IN starts anyway.
}

function startTour() {
  mode = 'tour';
  tourToggleBtn.textContent = 'Auto Tour: On';
  canvas.style.cursor = 'default';

  const now = performance.now();
  const fit = computeOverviewFit();
  if (fit) {
    // Short catch-up tween from wherever the user left the camera, capped
    // so it never runs longer than the overview hold itself.
    beginCameraTween({
      mode: 'toOverview',
      targetZoom: fit.zoom, targetPanX: fit.panX, targetPanY: fit.panY,
      duration: Math.min(1200, DURATIONS_MS[TOUR_OVERVIEW]),
    }, now);
  }
  tourState = TOUR_OVERVIEW;
  tourStateStartTime = now;
  currentTourNode = null;
}

function stopTour() {
  mode = 'manual';
  tourToggleBtn.textContent = 'Auto Tour: Off';
  canvas.style.cursor = 'grab';
  tween.active = false;
  currentTourNode = null;
}

const tourToggleBtn = document.getElementById('tour-toggle');
tourToggleBtn.addEventListener('click', () => {
  if (mode === 'manual') startTour();
  else stopTour();
});

// How often to check the server for new submissions. Just a polling
// interval against the existing /api/graph-data endpoint -- no server
// changes needed. Bump this up/down if you want fresher/less-chatty updates.
const POLL_MS = 15000;

// nodes/edges are keyed by mongoId (the API's node id) so that adding or
// removing a node never has to reindex anything else. Edges hold direct
// references to their node objects (sourceNode/targetNode) rather than
// array indices, for the same reason.
const nodesById = new Map();

function flashStatus(msg, revertTo) {
  const el = document.getElementById("status");
  el.textContent = msg;
  if (revertTo) setTimeout(() => { el.textContent = revertTo; }, 4000);
}

function fetchGraphData() {
  return fetch("/api/graph-data").then(r => r.json());
}

// Builds a fresh node object for a node the sim hasn't seen before.
// Spawns near the center at a random angle -- the existing spring/repulsion
// forces naturally carry it out to the right spot within a second or two,
// same as how the very first load looks.
function makeNode(n) {
  const angle = Math.random() * Math.PI * 2;
  const node = {
    mongoId: n.id,
    caption: n.caption,
    isHub: n.isHub,
    label: n.label,
    sceneBroad: n.sceneBroad,
    sceneSpecific: n.sceneSpecific,
    sceneConfidence: n.sceneConfidence,
    x: canvas.width / 2 + Math.cos(angle) * 150,
    y: canvas.height / 2 + Math.sin(angle) * 150,
    vx: 0, vy: 0,
    loaded: false,
    imgEl: null
  };
  if (n.img) {
    const imgEl = new Image();
    imgEl.crossOrigin = "anonymous";
    imgEl.onload = () => {
      node.loaded = true;
      const size = node.isHub ? maxHubDimension : maxNodeDimension;
      const scale = size / Math.max(imgEl.naturalWidth, imgEl.naturalHeight);
      node.drawW = imgEl.naturalWidth * scale;
      node.drawH = imgEl.naturalHeight * scale;
    };
    imgEl.onerror = () => console.error("Failed to load image:", n.img);
    imgEl.src = n.img;
    node.imgEl = imgEl;
  }
  return node;
}

function rebuildEdges(apiEdges) {
  return apiEdges
    .map(e => ({
      sourceNode: nodesById.get(e.source),
      targetNode: nodesById.get(e.target),
      confidence: e.confidence,
    }))
    .filter(e => e.sourceNode && e.targetNode);
}

function applyGraphData(apiNodes, apiEdges, { isInitial } = {}) {
  const incomingIds = new Set(apiNodes.map(n => n.id));
  let newCount = 0;
  const newImageIds = []; // for interruptForNewSubmission -- hubs don't count

  // Add/update nodes.
  for (const n of apiNodes) {
    if (!nodesById.has(n.id)) {
      nodesById.set(n.id, makeNode(n));
      if (!n.isHub) { newCount++; newImageIds.push(n.id); }
    } else {
      // Keep position/velocity/image, just refresh classification-derived fields.
      const existing = nodesById.get(n.id);
      existing.sceneBroad = n.sceneBroad;
      existing.sceneSpecific = n.sceneSpecific;
      existing.sceneConfidence = n.sceneConfidence;
      existing.caption = n.caption;
    }
  }

  // Drop nodes no longer returned by the server (unapproved/deleted).
  for (const id of [...nodesById.keys()]) {
    if (!incomingIds.has(id)) nodesById.delete(id);
  }

  nodes = [...nodesById.values()];
  edges = rebuildEdges(apiEdges);

  const summary = `${apiNodes.filter(n => !n.isHub).length} images, ${apiEdges.length} connections`;
  document.getElementById("status").textContent = summary;
  if (!isInitial && newCount > 0) {
    flashStatus(`+${newCount} new submission${newCount > 1 ? 's' : ''}`, summary);
    if (mode === 'tour') interruptForNewSubmission(newImageIds);
  }
}

function startPolling() {
  setInterval(() => {
    fetchGraphData()
      .then(({ nodes: apiNodes, edges: apiEdges }) => applyGraphData(apiNodes, apiEdges))
      .catch(err => console.error("Poll for new submissions failed:", err));
  }, POLL_MS);
}

// Load graph data, build nodes/edges, then start the sim and begin polling for new submissions.
fetchGraphData()
  .then(({ nodes: apiNodes, edges: apiEdges }) => {
    applyGraphData(apiNodes, apiEdges, { isInitial: true });
    animate();
    startPolling();
  })
  .catch(err => {
    document.getElementById("status").textContent =
      "Failed to load graph data: " + err.message;
    console.error(err);
  });
</script>
</body>
